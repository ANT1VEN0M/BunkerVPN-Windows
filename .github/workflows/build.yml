name: Build & Release BunkerVPN Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Download sing-box core & WinTUN driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core
          New-Item -ItemType Directory -Force -Path dist
          
          Write-Host "[+] Downloading sing-box core..."
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
          Invoke-WebRequest -Uri $sbUrl -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath sb_extracted
          Get-ChildItem -Path sb_extracted -Recurse -Filter "sing-box.exe" | Copy-Item -Destination "core\sing-box.exe"
          
          Write-Host "[+] Downloading WinTUN driver..."
          $wtUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $wtUrl -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt_extracted
          Copy-Item "wt_extracted\wintun\bin\amd64\wintun.dll" -Destination "core\wintun.dll"

          Write-Host "[+] Core files prepared:"
          Get-ChildItem core\

      - name: Publish .NET 8 WPF Application
        shell: pwsh
        run: |
          dotnet publish src/BunkerVPN/BunkerVPN.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package Core into Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\core
          Copy-Item core\sing-box.exe publish\core\
          Copy-Item core\wintun.dll publish\core\
          Write-Host "[+] Packaged publish directory:"
          Get-ChildItem publish\

      - name: Automated Smoke Test & Screen Capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          Write-Host "[+] Testing core version:"
          & "publish\core\sing-box.exe" version

          Write-Host "[+] Launching BunkerVPN for smoke test..."
          $proc = Start-Process -FilePath "publish\BunkerVPN.exe" -PassThru
          Start-Sleep -Seconds 4

          # Capture Screen to artifact
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshotPath = "dist\bunkervpn_smoke_test.png"
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "[+] Smoke test completed. Process alive: $(!$proc.HasExited)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath dist\BunkerVPN-Windows-v1.0.11-Portable.zip -CompressionLevel Optimal

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Smoke Test Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-screenshot
          path: dist\bunkervpn_smoke_test.png
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BunkerVPN-Windows-v1.0.11
          path: |
            dist\BunkerVPN-Windows-v1.0.11-Setup.exe
            dist\BunkerVPN-Windows-v1.0.11-Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.11
          name: BunkerVPN for Windows v1.0.11 ⚡ Ultra-Speed & Anti-Freeze Hotfix
          body: |
            # 🐈‍⬛ BunkerVPN for Windows PC (Release v1.0.11)
            
            ⚡ Комплексный хотфикс стабильности, скорости и интерфейса по отзывам подписчиков!

            ---

            ### 🚀 Что нового в v1.0.11:
            * 🛡️ **Полное устранение зависаний при отключении (Anti-Freeze):**
              - Процесс отключения переведён в полностью асинхронный фоновый поток (`Task.Run`). Интерфейс больше никогда не замирает и не блокируется.
              - Кнопка отключения мгновенно переходит в статус `ОТКЛЮЧЕНИЕ...` с блокировкой повторных кликов.
              - Безопасная очистка системных прокси WinINet без зависания UI-потока.
            * ⚡ **Ультра-скорость и моментальная отправка сообщений (Zero-Lag):**
              - Фиксированный безопасный MTU `1360` (полная защита от дропа пакетов и задержек в Telegram/Discord).
              - Переход на `stack: "mixed"` (высокоскоростной gVisor для TCP + нативный стек для UDP).
              - Отключён `strict_route`, вызывавший конфликты шлюзов и задержки.
              - Раздельный DNS: защищённый DoH `https://76.76.2.11/p0` через прокси-туннель для зарубежных сервисов (защита от DNS-отравления провайдеров).
            * 🔄 **Фикс встроенного обновления:**
              - Таймаут загрузки инсталлера в `UpdateService` увеличен до 10 минут (устранена ошибка `HttpClient.Timeout`).
            * 🎨 **Редизайн и улучшение отображения:**
              - Устранена дубликация пинга в названии серверов (`CleanName`).
              - Новая плавная кнопка «ПОДКЛЮЧИТЬ / ОТКЛЮЧИТЬ» с закруглением 14px и неоновым свечением.
              - Включено аппаратное сглаживание шрифтов (`ClearType` / `Display`).
              - Полноценный ресайз окна мышкой и кнопка максимизации `🗖`.

            ---

            ### 📦 Скачать:
            * 📥 **Установщик (Installer):** [BunkerVPN-Windows-v1.0.11-Setup.exe](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.11/BunkerVPN-Windows-v1.0.11-Setup.exe)
            * 🧰 **Портативная версия (Portable ZIP):** [BunkerVPN-Windows-v1.0.11-Portable.zip](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.11/BunkerVPN-Windows-v1.0.11-Portable.zip)
          files: |
            dist/BunkerVPN-Windows-v1.0.11-Setup.exe
            dist/BunkerVPN-Windows-v1.0.11-Portable.zip
            dist/bunkervpn_smoke_test.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
