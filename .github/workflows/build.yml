name: Build & Release BunkerVPN Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Download sing-box core & WinTUN driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core
          New-Item -ItemType Directory -Force -Path dist
          
          Write-Host "[+] Downloading sing-box core..."
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
          Invoke-WebRequest -Uri $sbUrl -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath sb_extracted
          Get-ChildItem -Path sb_extracted -Recurse -Filter "sing-box.exe" | Copy-Item -Destination "core\sing-box.exe"
          
          Write-Host "[+] Downloading WinTUN driver..."
          $wtUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $wtUrl -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt_extracted
          Copy-Item "wt_extracted\wintun\bin\amd64\wintun.dll" -Destination "core\wintun.dll"

          Write-Host "[+] Core files prepared:"
          Get-ChildItem core\

      - name: Publish .NET 8 WPF Application
        shell: pwsh
        run: |
          dotnet publish src/BunkerVPN/BunkerVPN.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package Core into Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\core
          Copy-Item core\sing-box.exe publish\core\
          Copy-Item core\wintun.dll publish\core\
          Write-Host "[+] Packaged publish directory:"
          Get-ChildItem publish\

      - name: Automated Smoke Test & Screen Capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          Write-Host "[+] Testing core version:"
          & "publish\core\sing-box.exe" version

          Write-Host "[+] Launching BunkerVPN for smoke test..."
          $proc = Start-Process -FilePath "publish\BunkerVPN.exe" -PassThru
          Start-Sleep -Seconds 4

          # Capture Screen to artifact
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshotPath = "dist\bunkervpn_smoke_test.png"
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "[+] Smoke test completed. Process alive: $(!$proc.HasExited)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath dist\BunkerVPN-Windows-v1.0.14-Portable.zip -CompressionLevel Optimal

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Smoke Test Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-screenshot
          path: dist\bunkervpn_smoke_test.png
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BunkerVPN-Windows-v1.0.14
          path: |
            dist\BunkerVPN-Windows-v1.0.14-Setup.exe
            dist\BunkerVPN-Windows-v1.0.14-Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14
          name: BunkerVPN for Windows v1.0.14 🛡️ YouTube 4K, NCSI Bypass & gVisor TUN Edition
          body: |
            # 🐈‍⬛ BunkerVPN for Windows PC (Release v1.0.14)
            
            ⚡ Выделенный каталог серверов YouTube 4K Ultra, решение проблемы «Без доступа к Интернету» в трее Windows, сетевой стек gVisor и VLESS XUDP!

            ---

            ### 🚀 Что нового в v1.0.14:
            * 📺 **Выделенный каталог «YouTube 4K Ultra»:**
              - Добавлена новая предустановленная подписка с выделенными серверами без буферизации для плавного просмотра 4K/2K 60fps контента на ПК.
            * 🛡️ **Решение проблемы «Без доступа к Интернету» (Жёлтый треугольник в трее Windows):**
              - Добавлен прямой байпас и приоритетное прямое разрешение системных проверок Windows NCSI (`msftconnecttest.com`, `msftncsi.com`).
              - Теперь значок сетевого подключения Windows мгновенно рапортует «Доступ к Интернету», разблокируя Microsoft Store, OneDrive, Windows Update и Outlook.
            * 🧠 **Сетевой стек gVisor по умолчанию в TUN:**
              - Переход с гибридного стека на проверенный изолированный user-space стек `gvisor`.
              - Исключает тихий сброс TCP-пакетов модулями WFP, брандмауэром Windows и сторонними антивирусами.
            * ⚡ **Полноценная поддержка VLESS XUDP (`packet_encoding: xudp`):**
              - Включено мультиплексирование UDP-трафика для VLESS Reality / TLS. Голосовые каналы Discord Voice, игровой UDP-трафик и DNS-запросы больше не зависают.
            * 🇷🇺 **Зеркала загрузки обновлений и подписок:**
              - Внедрена отказоустойчивая загрузка подписок и обновлений через CDN-зеркала (`ghfast.top`, `ghproxy.net`, `mirror.ghproxy.com`), обеспечивающая стабильную работу на любых провайдерах РФ.
            * 🚀 **Поддержка xhttp / httpupgrade транспортов:**
              - Корректная обработка современных типов прокси-серверов в подписках.
            * 🚀 **Монитор скорости в реальном времени (Live Speedometer):**
              - В центральный круг подключения встроен аккуратный цифровой спидометр (`↓ Скачивание` / `↑ Отдача` в KB/s и MB/s).
            * 🩺 **Кнопка экспресс-диагностики «🩺 Тест сети»:**
              - Быстрая проверка шлюза `HTTP 204 No Content` через туннель с замером реального пинга в миллисекундах.
            * 🔪 **Встроенный оптимизатор Windows (Copilot & AI Bloat Killer):**
              - Блокировка скрытого автозапуска Microsoft Copilot для разгрузки ОЗУ и процессора.

            ---

            ### 📦 Скачать:
            * 📥 **Установщик (Installer):** [BunkerVPN-Windows-v1.0.14-Setup.exe](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.14/BunkerVPN-Windows-v1.0.14-Setup.exe)
            * 🧰 **Портативная версия (Portable ZIP):** [BunkerVPN-Windows-v1.0.14-Portable.zip](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.14/BunkerVPN-Windows-v1.0.14-Portable.zip)
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
            dist/bunkervpn_smoke_test.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
