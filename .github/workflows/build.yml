name: Build & Release BunkerVPN Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Client & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Download sing-box core & WinTUN driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core
          New-Item -ItemType Directory -Force -Path dist
          
          Write-Host "[+] Downloading sing-box core..."
          $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip"
          Invoke-WebRequest -Uri $sbUrl -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath sb_extracted
          Get-ChildItem -Path sb_extracted -Recurse -Filter "sing-box.exe" | Copy-Item -Destination "core\sing-box.exe"
          
          Write-Host "[+] Downloading WinTUN driver..."
          $wtUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $wtUrl -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt_extracted
          Copy-Item "wt_extracted\wintun\bin\amd64\wintun.dll" -Destination "core\wintun.dll"

          Write-Host "[+] Core files prepared:"
          Get-ChildItem core\

      - name: Publish .NET 8 WPF Application
        shell: pwsh
        run: |
          dotnet publish src/BunkerVPN/BunkerVPN.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package Core into Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\core
          Copy-Item core\sing-box.exe publish\core\
          Copy-Item core\wintun.dll publish\core\
          Write-Host "[+] Packaged publish directory:"
          Get-ChildItem publish\

      - name: Automated Smoke Test & Screen Capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          Write-Host "[+] Testing core version:"
          & "publish\core\sing-box.exe" version

          Write-Host "[+] Launching BunkerVPN for smoke test..."
          $proc = Start-Process -FilePath "publish\BunkerVPN.exe" -PassThru
          Start-Sleep -Seconds 4

          # Capture Screen to artifact
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshotPath = "dist\bunkervpn_smoke_test.png"
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()

          Write-Host "[+] Smoke test completed. Process alive: $(!$proc.HasExited)"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath dist\BunkerVPN-Windows-v1.0.9-Portable.zip -CompressionLevel Optimal

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Smoke Test Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test-screenshot
          path: dist\bunkervpn_smoke_test.png
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BunkerVPN-Windows-v1.0.9
          path: |
            dist\BunkerVPN-Windows-v1.0.9-Setup.exe
            dist\BunkerVPN-Windows-v1.0.9-Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: BunkerVPN for Windows v1.0.9 ⚡ GeoIP/GeoSite Hotfix & Instant Start
          body: |
            # 🐈‍⬛ BunkerVPN for Windows PC (Release v1.0.9 Hotfix)
            
            ⚡ Критический хотфикс запуска ядра sing-box 1.11+: устранено мигание кнопки «Подключить» и зависимость от внешних баз GeoIP/GeoSite!

            ---

            ### 🚀 Что исправлено в v1.0.9 Hotfix:
            * 🛡️ **Фикс мгновенного отключения («мигает и не запускается»):** 
              - Sing-box 1.11+ по умолчанию падал с ошибкой при наличии правил GeoIP/GeoSite без флагов совместимости.
              - Внедрены переменные окружения `ENABLE_DEPRECATED_GEOIP=true` и `ENABLE_DEPRECATED_GEOSITE=true`.
              - Вся маршрутизация обхода РФ и игровых сервисов переведена на мгновенные нативные списки `domain_suffix` — клиенту больше не нужно скачивать 50 МБ баз из заблокированного GitHub! Запуск происходит за 0.00 секунды в 100% офлайн-режиме.
            * 🎮 **Сохранены все геймерские оптимизации:**
              - Full-Cone NAT (`endpoint_independent_nat: true`) и MTU `1340` для Discord Voice и Brawl Stars.
              - Раздельный роутинг игр (CS2, Dota 2, Steam CDN — напрямую с пингом 5-15 мс).

            ---

            ### 📦 Скачать:
            * 📥 **Установщик (Installer):** [BunkerVPN-Windows-v1.0.9-Setup.exe](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.9/BunkerVPN-Windows-v1.0.9-Setup.exe)
            * 🧰 **Портативная версия (Portable ZIP):** [BunkerVPN-Windows-v1.0.9-Portable.zip](https://github.com/ANT1VEN0M/BunkerVPN-Windows/releases/download/v1.0.9/BunkerVPN-Windows-v1.0.9-Portable.zip)
          files: |
            dist/BunkerVPN-Windows-v1.0.9-Setup.exe
            dist/BunkerVPN-Windows-v1.0.9-Portable.zip
            dist/bunkervpn_smoke_test.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
